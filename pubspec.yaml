name: secure_messenger
description: Secure bilingual messenger (Persian/English) with strong privacy and admin control.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  http: ^1.2.2
  http_parser: ^4.0.2

  # Storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Media & Permissions
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  file_picker: ^10.3.10
  video_player: ^2.9.2
  chewie: ^1.8.5
  record: ^7.1.1
  path: ^1.9.0

  # Device Info & Security
  device_info_plus: ^11.1.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  encrypt: ^5.0.3
  geolocator: ^13.0.2
  image: ^4.2.0

  # UI & Animation
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  shimmer: ^3.0.0
  font_awesome_flutter: ^10.8.0
  google_fonts: ^6.2.1

  # 2FA & QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Notifications — no Firebase/FCM: sanctions-proof local notifications fed
  # by polling (foreground) and WorkManager (background/killed app).
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  # Persistent background connection (Telegram-style keep-alive): a foreground
  # service that survives swipe-away on Xiaomi/Huawei/Oppo where WorkManager
  # jobs are force-stopped with the app.
  flutter_foreground_task: ^11.0.3
  # Firebase Cloud Messaging: instant external wake-up ticks (data-only).
  # Fully optional at runtime — without google-services.json the app runs
  # on local polling. See FCM_SETUP.md.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Utils
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  connectivity_plus: ^6.1.0
  timeago: ^3.7.0
  collection: ^1.19.0
  equatable: ^2.0.7

dependency_overrides:
  # جلوگیری از تداخل record_linux با platform interface
  # record_platform_interface: 1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/
    - assets/icons/reyno_logo.png
    - assets/icons/reyno_logo_dark.png

  # fonts:
  #   - family: Vazirmatn
  #     fonts:
  #       - asset: assets/fonts/Vazirmatn-Regular.ttf
  #       - asset: assets/fonts/Vazirmatn-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Vazirmatn-Medium.ttf
  #         weight: 500

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#EAF6FF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 24
